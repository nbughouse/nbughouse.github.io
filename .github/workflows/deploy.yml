name: Deploy to VM

on:
    push:
        branches:
            - main

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: SSH into VM, build Docker image, and reload
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.VM_HOST }}
                  username: ${{ secrets.VM_USER }}
                  key: ${{ secrets.VM_SSH_KEY }}
                  script: |
                      set -e

                      APP_DIR=/opt/BughouseNPlayer
                      DATA_DIR=/opt/BughouseNPlayer-data
                      STATS_FILE="$DATA_DIR/stats-events.jsonl"
                      REPO_URL=https://github.com/${{ github.repository }}.git

                      sudo mkdir -p "$DATA_DIR"
                      if [ ! -e "$STATS_FILE" ]; then
                          sudo install -m 600 /dev/null "$STATS_FILE"
                      fi
                      sudo chmod 600 "$STATS_FILE" || true
                      if command -v chattr >/dev/null 2>&1; then
                          sudo chattr +a "$STATS_FILE" || true
                      fi

                      if [ -e "$APP_DIR" ] && [ ! -d "$APP_DIR/.git" ]; then
                          BACKUP_DIR="${APP_DIR}.backup.$(date +%Y%m%d%H%M%S)"
                          sudo mv "$APP_DIR" "$BACKUP_DIR"
                          echo "Moved non-git deploy directory to $BACKUP_DIR"
                      fi

                      if [ ! -d "$APP_DIR/.git" ]; then
                          sudo mkdir -p "$APP_DIR"
                          sudo chown -R "$USER":"$USER" "$APP_DIR"
                          git clone "$REPO_URL" "$APP_DIR"
                      fi

                      cd "$APP_DIR"

                      sudo chown -R "$USER":"$USER" "$APP_DIR"

                      git remote set-url origin "$REPO_URL"
                      git fetch origin main
                      git reset --hard origin/main

                      sudo docker network create web || true

                      sudo docker compose up -d --build --remove-orphans

                      sudo docker image prune -f
