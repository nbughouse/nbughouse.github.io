services:
    bughouse-n-player:
        build:
            context: .
        container_name: bughouse-n-player
        restart: unless-stopped
        environment:
            NODE_ENV: production
            HOST: 0.0.0.0
            PORT: 8000
            FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://nbug.app}
            BUGHOUSE_STATS_EVENTS_FILE: /app/data/stats-events.jsonl
        volumes:
            - /opt/BughouseNPlayer-data:/app/data
        expose:
            - "8000"
        networks:
            - web

networks:
    web:
        external: true
